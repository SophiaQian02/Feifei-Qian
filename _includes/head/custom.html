<link rel="icon" type="image/png" sizes="192x192" href="{{ "/images/cat-icon.png" | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ "/images/favicon.svg" | relative_url }}?v=cat">
<link rel="apple-touch-icon" href="{{ "/images/cat-icon.png" | relative_url }}">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ "/assets/css/academicons.css" | relative_url }}"/>

{% if page.mathjax %}
<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>

{% endif %}
<!-- end custom head snippets -->
